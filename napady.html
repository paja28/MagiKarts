        <section>
            <p>Máš nějaký zajímavý nápad, čím by se dala zlepšit hra, nebo ti naopak přijde něco na hře špatné?</p>

                    <legend>Nápady</legend>

                    <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">

                    <button type="submit">Odeslat nápad</button>
